name: Deploy iOS to TestFlight

# Inactif tant que les secrets Apple ne sont pas ajoutés (Settings → Secrets
# and variables → Actions sur ce dépôt) : APPSTORE_KEY_ID, APPSTORE_ISSUER_ID,
# APPSTORE_API_KEY_BASE64, IOS_DIST_CERT_BASE64, IOS_DIST_CERT_PASSWORD,
# APPLE_TEAM_ID. Tourne sur un runner macOS (Xcode déjà installé) — aucun Mac
# personnel n'est nécessaire.
on:
  push:
    branches:
      - main
      - claude/trouve-ta-voie-app-g11prw
  workflow_dispatch:

jobs:
  deploy:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check for Apple secrets
        id: check
        env:
          HAS_KEY: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
        run: echo "enabled=${{ env.HAS_KEY != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.check.outputs.enabled == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.enabled == 'true'
        with:
          node-version: 20

      - name: Build www/ and sync the iOS project
        if: steps.check.outputs.enabled == 'true'
        run: |
          npm ci
          npm run ios:sync

      - uses: ruby/setup-ruby@v1
        if: steps.check.outputs.enabled == 'true'
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install CocoaPods dependencies
        if: steps.check.outputs.enabled == 'true'
        working-directory: ios/App
        run: pod install

      - name: Decode Apple credentials
        if: steps.check.outputs.enabled == 'true'
        env:
          APPSTORE_API_KEY_BASE64: ${{ secrets.APPSTORE_API_KEY_BASE64 }}
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/creds"
          echo "$APPSTORE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/creds/AuthKey.p8"
          echo "$IOS_DIST_CERT_BASE64" | base64 --decode > "$RUNNER_TEMP/creds/dist_cert.p12"

      - name: Build and upload to TestFlight
        if: steps.check.outputs.enabled == 'true'
        env:
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_API_KEY_PATH: ${{ runner.temp }}/creds/AuthKey.p8
          IOS_DIST_CERT_PATH: ${{ runner.temp }}/creds/dist_cert.p12
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: fr.trouvetavoie.app
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: bundle exec fastlane ios beta

      - name: Remove temporary keychain and credentials
        if: always() && steps.check.outputs.enabled == 'true'
        run: |
          security delete-keychain ci_keychain.keychain-db 2>/dev/null || true
          rm -rf "$RUNNER_TEMP/creds"
